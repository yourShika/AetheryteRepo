<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aetheryte Repo – FFXIV Dalamud Plugins</title>
<meta name="description" content="One Dalamud repo instead of two hundred: 290+ plugin sources, merged automatically, deduplicated and sorted into categories.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="logo.png">
<meta property="og:title" content="Aetheryte Repo">
<meta property="og:description" content="One Dalamud repo instead of two hundred. Merged automatically, deduplicated, sorted into categories.">

<style>
  :root{
    --bg:#f6f5f2; --panel:#fffefb; --panel-2:#efece5; --line:#ddd8cd;
    --fg:#1c1a17; --muted:#6a655c; --accent:#2f6f6b; --accent-fg:#fff;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.18);
    --radius:12px; --topbar:rgba(255,254,251,.86);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#14161a; --panel:#1b1e24; --panel-2:#232830; --line:#2f3540;
      --fg:#e8e6e1; --muted:#98a0ad; --accent:#5fd3c6; --accent-fg:#0d1114;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
      --topbar:rgba(27,30,36,.86);
    }
  }
  :root[data-theme=dark]{
    --bg:#14161a; --panel:#1b1e24; --panel-2:#232830; --line:#2f3540;
    --fg:#e8e6e1; --muted:#98a0ad; --accent:#5fd3c6; --accent-fg:#0d1114;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
    --topbar:rgba(27,30,36,.86);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent)}

  /* ---------------------------------------------------------- topbar */
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--topbar);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{
    max-width:1120px;margin:0 auto;padding:9px 20px;
    display:flex;align-items:center;gap:14px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;
         color:var(--fg);text-decoration:none;font-size:14.5px}
  .brand .mark{
    width:24px;height:24px;flex:none;background:var(--accent);
    -webkit-mask:url(logo.svg) center/contain no-repeat;
            mask:url(logo.svg) center/contain no-repeat;
  }
  .spacer{flex:1}
  .langs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line);
         border-radius:999px;padding:2px}
  .langs button{
    border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;
    font-weight:600;letter-spacing:.03em;padding:4px 10px;border-radius:999px;cursor:pointer;
  }
  .langs button:hover{color:var(--fg)}
  .langs button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}

  /* ------------------------------------------------------------ page */
  .wrap{max-width:1120px;margin:0 auto;padding:30px 20px 80px}
  header{display:flex;align-items:center;gap:20px}
  .logo{
    flex:none;width:82px;height:82px;background:var(--accent);
    -webkit-mask:url(logo.svg) center/contain no-repeat;
            mask:url(logo.svg) center/contain no-repeat;
  }
  header h1{margin:0 0 6px;font-size:clamp(26px,4vw,38px);letter-spacing:-.02em}
  header p.sub{margin:0;color:var(--muted);max-width:62ch}
  @media (max-width:560px){ header{gap:14px} .logo{width:58px;height:58px} }

  .stat-row{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 30px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:10px 16px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:22px;line-height:1.2}
  .stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}

  h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
     margin:34px 0 12px;font-weight:600}

  .feeds{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
  .feed{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
  .feed .emoji{font-size:20px;flex:none;width:24px;text-align:center}
  .feed .meta{flex:1;min-width:0}
  .feed .meta b{display:block;font-size:14px}
  .feed .meta small{color:var(--muted);font-size:12px}
  .feed.primary{border-color:var(--accent);border-width:2px}
  button.copy{
    flex:none;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);
    border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;
    white-space:nowrap;transition:background .12s,border-color .12s
  }
  button.copy:hover{border-color:var(--accent)}
  button.copy.done{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 16px}
  input[type=search]{
    flex:1;min-width:200px;background:var(--panel);color:var(--fg);
    border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit
  }
  input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .chip{
    border:1px solid var(--line);background:var(--panel);color:var(--muted);
    border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer
  }
  .chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

  /* ------------------------------------------------------------ cards */
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 15px;box-shadow:var(--shadow);display:flex;gap:12px;
    font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;
    transition:border-color .12s,transform .12s
  }
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card img{width:40px;height:40px;border-radius:9px;object-fit:cover;flex:none;background:var(--panel-2)}
  .card .body{min-width:0;flex:1}
  .card .title{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
  .card .title b{font-size:14.5px}
  .card .title code{font-size:11.5px;color:var(--muted)}
  .card p{margin:4px 0 7px;color:var(--muted);font-size:13px;
          display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel-2);
       color:var(--muted);border:1px solid var(--line)}
  .tag.cat{border-color:var(--accent);color:var(--accent)}
  .empty{color:var(--muted);padding:26px 0}

  footer{margin-top:46px;padding-top:18px;border-top:1px solid var(--line);
         color:var(--muted);font-size:13px}
  table.src{width:100%;border-collapse:collapse;font-size:13px}
  table.src td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.src td:first-child{width:1%;white-space:nowrap}
  .ok{color:#3aa675}.stale{color:#c99a2e}.failed{color:#d4674f}

  /* ------------------------------------------------------------ modal */
  dialog{
    border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);
    padding:0;max-width:660px;width:calc(100% - 32px);max-height:86vh;box-shadow:var(--shadow)
  }
  dialog::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(2px)}
  .m-head{display:flex;gap:14px;padding:20px 20px 14px;border-bottom:1px solid var(--line)}
  .m-head img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--panel-2)}
  .m-head .t{flex:1;min-width:0}
  .m-head h3{margin:0 0 3px;font-size:19px;letter-spacing:-.01em}
  .m-head .by{color:var(--muted);font-size:13px}
  .m-close{
    flex:none;align-self:flex-start;border:1px solid var(--line);background:var(--panel-2);
    color:var(--fg);width:30px;height:30px;border-radius:8px;cursor:pointer;
    font-size:17px;line-height:1;padding:0
  }
  .m-close:hover{border-color:var(--accent)}
  .m-body{padding:16px 20px 20px;overflow-y:auto;max-height:calc(86vh - 96px)}
  .m-body h4{margin:18px 0 7px;font-size:12px;text-transform:uppercase;
             letter-spacing:.07em;color:var(--muted);font-weight:600}
  .m-body h4:first-child{margin-top:0}
  .m-desc{white-space:pre-wrap;font-size:13.5px;color:var(--fg);margin:0;overflow-wrap:anywhere}
  .m-desc.small{color:var(--muted);font-size:13px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13.5px;margin:0}
  .kv dt{color:var(--muted)}
  .kv dd{margin:0;overflow-wrap:anywhere}
  .m-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .m-links a{
    border:1px solid var(--line);background:var(--panel-2);border-radius:8px;
    padding:7px 11px;font-size:12.5px;text-decoration:none;color:var(--fg)
  }
  .m-links a:hover{border-color:var(--accent)}
  .m-feed{display:flex;align-items:center;gap:10px;background:var(--panel-2);
          border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-top:6px}
  .m-feed code{flex:1;min-width:0;font-size:11.5px;overflow-wrap:anywhere;color:var(--muted)}
  @media (max-width:560px){ .kv{grid-template-columns:1fr;gap:2px} .kv dt{margin-top:8px} }
</style>
</head>

  <p class="empty" id="empty" hidden data-i18n="empty"></p>

  <h2 data-i18n="sourcesHeading"></h2>

  <footer>
    <span data-i18n="lastUpdated"></span> <span id="gen">–</span> ·
    <a href="#" id="repolink" data-i18n="repoLink"></a><br>
    <span data-i18n="disclaimer"></span>
  </footer>
</div>

<dialog id="modal" aria-labelledby="m-title">
  <div class="m-head">
    <img id="m-icon" alt="" hidden>
    <div class="t">
      <h3 id="m-title"></h3>
      <div class="by" id="m-by"></div>
    </div>
    <button class="m-close" id="m-close" type="button">&times;</button>
  </div>
  <div class="m-body" id="m-body"></div>
</dialog>

      glamour:["ミラプリ・キャラクター","Mod、外見、ポーズ、同期"],
      combat:["戦闘・ローテーション","ローテーション、ボスタイムライン、コンボ、PvP"],
      automation:["自動化","AutoDuty、ナビメッシュ、リテイナー、クエスト、周回"],
      crafting:["製作・採集","製作、採集、マーケットボード"],
      qol:["快適化・UI","調整、インターフェース、チャット、所持品、マップ"],
      social:["ソーシャル・ロールプレイ","RPプロフィール、エモート、FC、Discord"],
      nsfw:["アダルト（18+）","成人向け。既定ではマスターに含まれません"],
      housing:["ハウジング・内装","家具、レイアウト、土地"],
      audio:["オーディオ・ボイス","ボイスチャット、読み上げ、音楽、効果音"],
      dev:["開発者・データ","デバッグ、データ閲覧、エディタ"],
      misc:["その他","分類しきれないもの"]
    }
  };

  var lang = "en";
  try { var st = localStorage.getItem("aetheryte-lang"); if (st && T[st]) lang = st; } catch (e) {}
  var t = function(k){ return (T[lang] && T[lang][k]) || T.en[k] || k; };
  var cat = function(id){ return (C[lang] && C[lang][id]) || C.en[id] || [id, ""]; };

  /* --------------------------------------------------------- helpers */

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };
  var num = function(n){ try { return Number(n).toLocaleString(lang); } catch (e) { return String(n); } };
  var when = function(sec){
    if (!sec) return null;
    try { return new Date(sec * 1000).toLocaleDateString(lang, {year:"numeric",month:"short",day:"numeric"}); }
    catch (e) { return null; }
  };

  // user/repo aus der Pages-URL ableiten, damit nichts hartkodiert ist.
  var host = location.hostname, seg = location.pathname.split("/").filter(Boolean);
  var owner = host.indexOf(".github.io") > -1 ? host.replace(".github.io", "") : "yourShika";
  var repo  = (host.indexOf(".github.io") > -1 && seg.length) ? seg[0] : "AetheryteRepo";
  var RAW = "https://raw.githubusercontent.com/" + owner + "/" + repo + "/main/";

  function copyBtn(url){
    var b = document.createElement("button");
    b.className = "copy"; b.type = "button"; b.textContent = t("copy");
    b.setAttribute("data-copy", url);
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      navigator.clipboard.writeText(url).then(function(){
        b.textContent = t("copied"); b.classList.add("done");
        setTimeout(function(){ b.textContent = t("copy"); b.classList.remove("done"); }, 1600);
      });
    });
    return b;
  }

  /* ------------------------------------------------------------ boot */

  var DATA = null;

  fetch("plugins.json", {cache:"no-cache"})
    .then(function(r){ return r.json(); })
    .then(function(d){ DATA = d; buildLangs(); renderAll(); })
    .catch(function(e){
      $("grid").innerHTML = '<p class="empty">' + esc(t("loadError") + e.message) + '</p>';
    });

  function buildLangs(){
    var box = $("langs");
    box.innerHTML = "";
    LANGS.forEach(function(L){
      var b = document.createElement("button");
      b.type = "button"; b.textContent = L.toUpperCase();
      b.setAttribute("aria-pressed", String(L === lang));
      b.addEventListener("click", function(){
        if (L === lang) return;
        lang = L;
        try { localStorage.setItem("aetheryte-lang", L); } catch (e) {}
        document.documentElement.lang = L;
        [].forEach.call(box.children, function(x, i){
          x.setAttribute("aria-pressed", String(LANGS[i] === lang));
        });
        renderAll();
        if (modal.open && current) openModal(current);
      });
      box.appendChild(b);
    });
    document.documentElement.lang = lang;
  }

  var query = "", active = null;

  function renderAll(){
    var d = DATA;

    // statische Beschriftungen
    [].forEach.call(document.querySelectorAll("[data-i18n]"), function(el){
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    $("q").placeholder = t("search");
    $("m-close").title = t("mClose");
    $("m-close").setAttribute("aria-label", t("mClose"));
    $("repolink").href = "https://github.com/" + owner + "/" + repo;

    var cats = d.categories.filter(function(c){ return c.count > 0; });
    var masterCount = d.categories.reduce(function(n, c){ return n + (c.id === "nsfw" ? 0 : c.count); }, 0);

    $("stats").innerHTML =
      stat(masterCount, t("statMaster")) + stat(d.plugins.length, t("statTotal")) +
      stat(d.sources.length, t("statSources")) + stat(cats.length, t("statCategories")) +
      stat(d.currentApiLevel || "–", t("statApi"));

    $("gen").textContent = d.generatedAt.replace("T", " ").slice(0, 16) + " UTC";

    /* --- Feeds --- */
    var feeds = [{ emoji:"⭐", name:t("master"), desc:t("masterDesc"), file:"repos/master.json",
                   count:masterCount, primary:true }];
    var nsfw = d.categories.filter(function(c){ return c.id === "nsfw"; })[0];
    if (nsfw && nsfw.count)
      feeds.push({ emoji:"\u{1F310}", name:t("masterFull"), desc:t("masterFullDesc"),
                   file:"repos/master-full.json", count:d.plugins.length });
    cats.forEach(function(c){
      var n = cat(c.id);
      feeds.push({ emoji:c.emoji, name:n[0], desc:n[1], file:c.file, count:c.count });
    });
    if (d.legacyPlugins)
      feeds.push({ emoji:"\u{1F5C3}\u{FE0F}", name:t("legacy"),
                   desc:t("legacyDesc").replace("{min}", d.minApiLevel),
                   file:"repos/legacy.json", count:d.legacyPlugins });

    var fw = $("feeds"); fw.innerHTML = "";
    feeds.forEach(function(f){
      var el = document.createElement("div");
      el.className = "feed" + (f.primary ? " primary" : "");
      el.innerHTML = '<span class="emoji">' + f.emoji + '</span>' +
        '<span class="meta"><b>' + esc(f.name) + '</b><small>' +
        esc(f.desc) + ' · ' + num(f.count) + ' ' + esc(t("plugins")) + '</small></span>';
      el.appendChild(copyBtn(RAW + f.file));
      fw.appendChild(el);
    });

    /* --- Filterchips --- */
    var cw = $("chips"); cw.innerHTML = "";
    cats.forEach(function(c){
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button";
      b.setAttribute("aria-pressed", String(active === c.id));
      b.textContent = c.emoji + " " + cat(c.id)[0] + " (" + num(c.count) + ")";
      b.addEventListener("click", function(){
        active = (active === c.id) ? null : c.id;
        [].forEach.call(cw.children, function(x){ x.setAttribute("aria-pressed", "false"); });
        if (active) b.setAttribute("aria-pressed", "true");
        renderGrid();
      });
      cw.appendChild(b);
    });

    renderGrid();

    /* --- Quellen --- */
    var mark = { ok:"✅", stale:"⚠️", cache:"\u{1F4BE}", failed:"❌" };
    $("sources").innerHTML = d.sources.map(function(s){
      return '<tr><td class="' + s.status + '">' + (mark[s.status] || "") + '</td>' +
        '<td><a href="' + esc(s.url) + '" rel="noopener">' + esc(s.name) + '</a></td>' +
        '<td>' + num(s.count) + '</td><td>' + esc(s.note || "") + '</td></tr>';
    }).join("");
  }

  function stat(v, label){
    return '<div class="stat"><b>' + (typeof v === "number" ? num(v) : esc(v)) +
           '</b><span>' + esc(label) + '</span></div>';
  }

  function renderGrid(){
    var q = query.toLowerCase().trim();
    var list = DATA.plugins.filter(function(p){
      if (active && p.category !== active) return false;
      if (!q) return true;
      return (p.name + " " + p.internalName + " " + p.author + " " + p.punchline + " " +
              p.source + " " + (p.tags || []).join(" ")).toLowerCase().indexOf(q) > -1;
    });
    $("empty").hidden = list.length > 0;

    var grid = $("grid");
    grid.innerHTML = list.map(function(p, i){
      var c = cat(p.category);
      var ci = (DATA.categories.filter(function(x){ return x.id === p.category; })[0] || {}).emoji || "";
      return '<button type="button" class="card" data-i="' + i + '">' +
        (p.iconUrl ? '<img loading="lazy" src="' + esc(p.iconUrl) + '" alt="" onerror="this.remove()">' : '') +
        '<span class="body"><span class="title"><b>' + esc(p.name) + '</b>' +
        '<code>v' + esc(p.version) + '</code></span>' +
        '<p>' + esc(p.punchline || "") + '</p><span class="tags">' +
        '<span class="tag cat">' + ci + ' ' + esc(c[0]) + '</span>' +
        '<span class="tag">' + esc(p.author || "?") + '</span>' +
        '<span class="tag">' + esc(p.source) + '</span>' +
        (p.testingOnly ? '<span class="tag">' + esc(t("testingOnly")) + '</span>' : '') +
        '</span></span></button>';
    }).join("");

    [].forEach.call(grid.children, function(el){
      el.addEventListener("click", function(){ openModal(list[+el.getAttribute("data-i")]); });
    });
  }

  $("q").addEventListener("input", function(e){ query = e.target.value; renderGrid(); });
  $("clear").addEventListener("click", function(){
    query = ""; active = null; $("q").value = "";
    [].forEach.call($("chips").children, function(x){ x.setAttribute("aria-pressed", "false"); });
    renderGrid();
  });

  /* ----------------------------------------------------------- modal */

  var modal = $("modal"), current = null;

  function row(label, value){
    if (value == null || value === "" ) return "";
    return "<dt>" + esc(label) + "</dt><dd>" + value + "</dd>";
  }

  function openModal(p){
    if (!p) return;
    current = p;
    var c = cat(p.category);
    var ci = (DATA.categories.filter(function(x){ return x.id === p.category; })[0] || {}).emoji || "";

    var icon = $("m-icon");
    if (p.iconUrl) { icon.src = p.iconUrl; icon.hidden = false; icon.onerror = function(){ icon.hidden = true; }; }
    else icon.hidden = true;

    $("m-title").textContent = p.name;
    $("m-by").textContent = (p.author || "?") + " · " + ci + " " + c[0];

    var api = p.apiLevel == null ? null :
      String(p.apiLevel) + (p.testingApiLevel && p.testingApiLevel !== p.apiLevel
        ? " (testing " + p.testingApiLevel + ")" : "");

    var html = "";

    var desc = (p.description || "").trim();
    if (desc && desc !== (p.punchline || "").trim()) {
      html += "<h4>" + esc(t("mDescription")) + "</h4><p class='m-desc'>" + esc(desc) + "</p>";
    } else if (p.punchline) {
      html += "<h4>" + esc(t("mDescription")) + "</h4><p class='m-desc'>" + esc(p.punchline) + "</p>";
    }

    html += "<h4>" + esc(t("mDetails")) + "</h4><dl class='kv'>" +
      row(t("mSource"), esc(p.source)) +
      row(t("mAuthor"), esc(p.author)) +
      row(t("mCategory"), ci + " " + esc(c[0])) +
      row(t("mInternal"), "<code>" + esc(p.internalName) + "</code>") +
      row(t("mVersion"), "<code>" + esc(p.version) + "</code>" +
          (p.testingOnly ? " · " + esc(t("testingOnly")) : "")) +
      row(t("mTesting"), p.testingVersion && p.testingVersion !== p.version
          ? "<code>" + esc(p.testingVersion) + "</code>" : null) +
      row(t("mApi"), api) +
      row(t("mApplicable"), esc(p.applicableVersion)) +
      row(t("mDownloads"), p.downloads ? num(p.downloads) : null) +
      row(t("mUpdated"), when(p.lastUpdate)) +
      row(t("mTags"), (p.tags && p.tags.length) ? esc(p.tags.join(", ")) : null) +
      "</dl>";

    if ((p.changelog || "").trim()) {
      html += "<h4>" + esc(t("mChangelog")) + "</h4><p class='m-desc small'>" +
              esc(p.changelog.trim()) + "</p>";
    }

    var links = [];
    if (p.repoUrl) links.push('<a href="' + esc(p.repoUrl) + '" target="_blank" rel="noopener">' + esc(t("mProject")) + '</a>');
    if (p.downloadLink) links.push('<a href="' + esc(p.downloadLink) + '" target="_blank" rel="noopener">' + esc(t("mDownload")) + '</a>');
    if (p.sourceUrl) links.push('<a href="' + esc(p.sourceUrl) + '" target="_blank" rel="noopener">' + esc(t("mSourceFeed")) + '</a>');
    if (links.length) html += "<h4>" + esc(t("mLinks")) + "</h4><div class='m-links'>" + links.join("") + "</div>";

    html += "<h4>" + esc(t("mInFeeds")) + "</h4><div id='m-feeds'></div>";

    $("m-body").innerHTML = html;

    // Feeds, die dieses Plugin enthalten – mit Kopierbutton.
    var box = $("m-body").querySelector("#m-feeds");
    var inFeeds = [{ label: t("master"), file: "repos/master.json" }];
    if (p.category === "nsfw") inFeeds = [{ label: t("masterFull"), file: "repos/master-full.json" }];
    inFeeds.push({ label: ci + " " + c[0], file: "repos/" + p.category + ".json" });
    inFeeds.forEach(function(f){
      var row = document.createElement("div");
      row.className = "m-feed";
      row.innerHTML = "<code>" + esc(RAW + f.file) + "</code>";
      row.appendChild(copyBtn(RAW + f.file));
      box.appendChild(row);
    });

    if (!modal.open) modal.showModal();
    $("m-body").scrollTop = 0;
  }

  $("m-close").addEventListener("click", function(){ modal.close(); });
  modal.addEventListener("click", function(e){ if (e.target === modal) modal.close(); });
  modal.addEventListener("close", function(){ current = null; });
  // <dialog> schliesst bei Escape eigentlich von selbst. Der explizite Handler
  // ist die Absicherung fuer Browser, in denen das nicht greift.
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && modal.open) modal.close();
  });
})();
</script>
</body>
</html>
