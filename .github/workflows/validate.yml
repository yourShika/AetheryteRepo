name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Quellen validieren
        run: node scripts/validate-sources.mjs

      - name: Aggregator-Testlauf (holt alle Quellen wirklich ab)
        run: node scripts/aggregate.mjs --dry-run
